name: Price check

on:
  schedule:
    # Times are in UTC. GitHub may start a scheduled run 5-30 minutes late.
    # Every 4 hours: 05:30, 09:30, 13:30, 17:30, 21:30, 01:30 IST.
    - cron: "0 */4 * * *"
  workflow_dispatch:        # the sheet's "Check prices now" button starts it this way

concurrency:
  group: price-check
  cancel-in-progress: false

jobs:
  # Platforms that work from GitHub's cloud servers.
  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Until the home-PC runner is connected (repository variable HOME_PC_RUNNER = on),
      # the cloud job also tries Amazon.in, Myntra and Blinkit (often blocked there).
      - name: Fetch prices and update the Google Sheet
        run: python -m tracker.run --platforms ${{ vars.HOME_PC_RUNNER == 'on' && 'flipkart,firstcry' || 'amazon_in,flipkart,firstcry,myntra,blinkit' }}
        env:
          SHEET_WEBAPP_URL: ${{ secrets.SHEET_WEBAPP_URL }}
          SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
          RUN_TRIGGER: ${{ github.event_name }}

  # Platforms that block cloud servers (Amazon, Myntra, Blinkit) run on the
  # office/home PC through GitHub's free "self-hosted runner" (see README).
  # If that PC is off, this job waits (up to 24 h) and runs when it is back.
  home-pc:
    if: ${{ vars.HOME_PC_RUNNER == 'on' }}
    runs-on: [self-hosted, price-tracker]
    timeout-minutes: 90
    steps:
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Install requirements (in the runner's own Python environment)
        run: |
          if (-not (Test-Path ..\..\pt-venv\Scripts\python.exe)) { python -m venv ..\..\pt-venv }
          ..\..\pt-venv\Scripts\python.exe -m pip install -q -r requirements.txt
      - name: Fetch prices (Amazon.in, Myntra, Blinkit) and update the Google Sheet
        run: ..\..\pt-venv\Scripts\python.exe -m tracker.run --platforms amazon_in,myntra,blinkit
        env:
          SHEET_WEBAPP_URL: ${{ secrets.SHEET_WEBAPP_URL }}
          SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
          RUN_TRIGGER: ${{ github.event_name }}
