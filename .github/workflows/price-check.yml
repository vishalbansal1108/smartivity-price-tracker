name: Price check

on:
  schedule:
    # Times are in UTC. GitHub may start a scheduled run a few minutes late.
    # TESTING: every 10 minutes.
    - cron: "*/10 * * * *"
    # NORMAL: every 4 hours (05:30, 09:30, 13:30, 17:30, 21:30, 01:30 IST).
    # To switch: put a # in front of the TESTING line above and remove the # below.
    # - cron: "0 */4 * * *"
  workflow_dispatch:        # lets you press "Run workflow" by hand

concurrency:
  group: price-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch prices and update the Google Sheet
        run: python -m tracker.run
        env:
          SHEET_WEBAPP_URL: ${{ secrets.SHEET_WEBAPP_URL }}
          SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
          RUN_TRIGGER: ${{ github.event_name }}
